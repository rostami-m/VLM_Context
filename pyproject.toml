[build-system]
requires = ["setuptools>=69"]
build-backend = "release_backend"
backend-path = ["."]

[project]
name = "vlm-context"
version = "0.2.0"
description = "Reproducible native-model studies of multimodal in-context behavior"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "Pillow>=10,<14"]
license = {file = "LICENSE"}

[project.optional-dependencies]
analysis = ["matplotlib>=3.8,<4"]
test = ["pytest>=8,<9", "pyflakes>=3.2,<4"]

[project.scripts]
vlm-context = "vlm_context.__main__:main"

[tool.setuptools.packages.find]
include = ["vlm_context*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
